apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-grade-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0          # Do not allow extra pods to spin up first
      maxUnavailable: 1    # Allow 1 old pod to take down during update
  selector:
    matchLabels:
      app.kubernetes.io/instance: student-grade-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-grade-api
        app.kubernetes.io/component: backened
        app.kubernetes.io/instance: student-grade-api
    spec:
      serviceAccountName: student-api-sa
      affinity:
        podAntiAffinity:
          # 2. Ensure this is changed to preferred (soft rule)
          preferredDuringSchedulingIgnoredDuringExecution: 
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: "app.kubernetes.io/instance"
                  operator: In
                  values:
                  - student-grade-api
              topologyKey: "kubernetes.io/hostname"
      tolerations:
        - key: "db"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
      - name: student-grade-api
        image: {{ .Values.backend.name}}
        envFrom:
          - configMapRef:
             name: student-grade-api-configmap
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-env-bridge  # Must match the secretName in your SecretProviderClass
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-env-bridge  # Must match the secretName in your SecretProviderClass
              key: DB_PASS
        resources:
          requests:
            memory: "128Mi"
          limits:
            memory: "250Mi"
        ports:
        - containerPort: {{ .Values.backend.port }}
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: student-kv
      imagePullSecrets:
        - name: acr-secret
      
